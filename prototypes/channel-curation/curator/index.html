<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype E — Guided Curator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%234fc3f7%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  /* E — Guided Curator: one decision at a time, identity → group → rules →
     programming → review. Apply happens once, at review, on purpose. */
  .cur-main { flex: 1; display: flex; min-height: 0; }
  .steps {
    width: 250px; flex: none; border-right: 1px solid var(--line);
    padding: 16px 0; display: flex; flex-direction: column; gap: 2px;
  }
  .steps .step {
    display: flex; gap: 12px; align-items: center; padding: 10px 18px;
    cursor: pointer; border-left: 3px solid transparent; color: var(--text-dim);
  }
  .steps .step .dot {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--line-strong); font-size: 12px; font-weight: 700;
  }
  .steps .step.current { color: var(--text); border-left-color: var(--accent); background: var(--bg-raise); }
  .steps .step.current .dot { border-color: var(--accent); }
  .steps .step.done .dot { background: var(--accent-dim); border-color: var(--accent); }
  .steps .step.blocked { opacity: .55; cursor: not-allowed; }
  .steps .step .st-label { font-weight: 600; }
  .steps .step .st-sub { font-size: 11.5px; color: var(--text-faint); }
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .stage .stage-head { padding: 14px 20px 0; }
  .stage .stage-body { flex: 1; min-height: 0; overflow: auto; padding: 12px 20px 90px; }
  .stage .stage-foot {
    display: flex; gap: 10px; align-items: center; padding: 12px 20px;
    border-top: 1px solid var(--line); background: var(--bg-raise);
  }
  .picker-list { max-width: 640px; }
  .diff-table { border-collapse: collapse; width: 100%; max-width: 760px; }
  .diff-table td, .diff-table th { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; font-size: 13px; }
  .diff-table th { color: var(--text-dim); font-weight: 600; width: 150px; }
  .diff-table .old { color: var(--text-dim); }
  @media (max-width: 760px) {
    .cur-main { flex-direction: column; }
    .steps { width: 100%; flex-direction: row; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
    .steps .step { border-left: 0; border-bottom: 3px solid transparent; padding: 8px 10px; flex: none; }
    .steps .step.current { border-bottom-color: var(--accent); }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
