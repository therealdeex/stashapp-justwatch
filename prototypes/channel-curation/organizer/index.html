<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype B — Group Organizer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%234fc3f7%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  /* B — Group Organizer: group-first browsing + organization. */
  .org-main { flex: 1; display: flex; min-height: 0; }
  .group-rail {
    width: 250px; flex: none; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .group-rail .g-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    cursor: pointer; border-left: 3px solid transparent; min-height: 46px;
  }
  .group-rail .g-row:hover { background: var(--bg-raise); }
  .group-rail .g-row[aria-selected="true"] { background: var(--bg-panel); border-left-color: var(--accent); }
  .group-rail .g-row .g-name { font-weight: 700; flex: 1; }
  .group-rail .g-row .g-count { color: var(--text-dim); font-family: var(--mono); font-size: 12px; }
  .group-rail .g-tools { padding: 10px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }

  .members { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .members .m-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .members .m-tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 10px; padding: 14px; align-content: start;
  }
  .card {
    background: var(--bg-raise); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 9px 10px; display: flex; gap: 10px; align-items: center; cursor: pointer;
    min-height: 52px;
  }
  .card:hover { border-color: var(--line-strong); }
  .card[aria-selected="true"] { border-color: var(--accent); }
  .card.dragover { border-color: var(--warn); border-style: dashed; }
  .card .c-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .c-sub { color: var(--text-dim); font-size: 11.5px; }
  .drop-empty {
    border: 1px dashed var(--line-strong); color: var(--text-faint);
    border-radius: var(--radius); padding: 14px; margin: 0 14px; text-align: center;
  }

  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 94vw);
    background: var(--bg-raise); border-left: 1px solid var(--line-strong);
    box-shadow: -12px 0 48px rgba(0,0,0,.5); z-index: 50; display: flex; flex-direction: column;
  }
  .drawer .drawer-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  @media (max-width: 760px) {
    .org-main { flex-direction: column; }
    .group-rail { width: 100%; max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
