<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype A — Channel Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%234fc3f7%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  /* A — Channel Studio: searchable dial + focused side-by-side editor. */
  .studio-main { display: flex; flex: 1; min-height: 0; }
  .dial { width: 360px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; }
  .dial .dial-tools { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .dial .row { min-height: 44px; }
  .editor-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .editor-pane .editor-head { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg-raise); }
  .bulk-bar {
    display: none; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--bg-panel); border-bottom: 1px solid var(--line-strong);
  }
  .bulk-bar.active { display: flex; }
  @media (max-width: 760px) {
    .studio-main { flex-direction: column; }
    .dial { width: 100%; max-height: 46vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .editor-pane { flex: 1; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
